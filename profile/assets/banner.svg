<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>OpenShelves: your university library, as easy to search as the web</title>

  <!-- Canvas -->
  <rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="#f3f1ec" stroke="#e5e0d8"/>

  <!-- Text -->
  <text x="72" y="96" font-size="12" font-weight="700" letter-spacing="2.4" fill="#5c6460">ACADEMIC DISCOVERY PLATFORM</text>
  <text x="68" y="164" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#2f5d45">OpenShelves</text>
  <text x="72" y="208" font-size="22" fill="#1e2320">Your university library, as easy to search as the web.</text>
  <text x="72" y="240" font-size="15" fill="#5c6460">Search · Borrow · Research · Manage</text>

  <!-- Shelf of book spines -->
  <g transform="translate(820 64)">
    <!-- spines: x, width, height, colour -->
    <rect x="0"   y="96"  width="34" height="128" rx="4" fill="#2f5d45"/>
    <rect x="40"  y="72"  width="28" height="152" rx="4" fill="#1e3f2e"/>
    <rect x="74"  y="112" width="38" height="112" rx="4" fill="#e4eee8" stroke="#2f5d45"/>
    <rect x="118" y="84"  width="26" height="140" rx="4" fill="#5c6460"/>
    <rect x="150" y="60"  width="36" height="164" rx="4" fill="#2f5d45"/>
    <rect x="192" y="104" width="30" height="120" rx="4" fill="#d8d2c7"/>
    <!-- leaning book -->
    <rect x="236" y="70" width="32" height="154" rx="4" fill="#1e3f2e" transform="rotate(12 252 224)"/>
    <rect x="300" y="120" width="44" height="104" rx="4" fill="#ffffff" stroke="#d8d2c7"/>

    <!-- spine details -->
    <g fill="#ffffff" fill-opacity="0.55">
      <rect x="8"   y="116" width="18" height="3" rx="1.5"/>
      <rect x="8"   y="124" width="12" height="3" rx="1.5"/>
      <rect x="47"  y="92"  width="14" height="3" rx="1.5"/>
      <rect x="158" y="80"  width="20" height="3" rx="1.5"/>
      <rect x="158" y="88"  width="14" height="3" rx="1.5"/>
      <rect x="125" y="104" width="12" height="3" rx="1.5"/>
    </g>
    <g fill="#2f5d45" fill-opacity="0.5">
      <rect x="84"  y="132" width="18" height="3" rx="1.5"/>
      <rect x="310" y="140" width="24" height="3" rx="1.5"/>
      <rect x="310" y="148" width="16" height="3" rx="1.5"/>
    </g>

    <!-- shelf -->
    <rect x="-24" y="224" width="400" height="10" rx="3" fill="#2f5d45"/>
    <rect x="-12" y="234" width="12" height="18" rx="2" fill="#1e3f2e"/>
    <rect x="352" y="234" width="12" height="18" rx="2" fill="#1e3f2e"/>
  </g>
</svg>
