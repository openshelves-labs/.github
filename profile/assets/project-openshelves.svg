<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>OpenShelves, the platform: a reading desk at night with a laptop showing a library search, beside a shelf of books.</title>
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1733"/><stop offset="1" stop-color="#1c2552"/></linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd59a" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffb37a" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="pageglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
    <g id="page"><path d="M-9,-12 L7,-12 L9,-10 L9,12 L-9,12 Z" fill="#fff3d6"/><g stroke="#c9a46a" stroke-width="1" opacity="0.6"><line x1="-6" y1="-6" x2="5" y2="-6"/><line x1="-6" y1="-2" x2="5" y2="-2"/><line x1="-6" y1="2" x2="3" y2="2"/></g></g><clipPath id="f"><rect width="620" height="300" rx="16"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="620" height="300" fill="url(#card)"/>
    <circle cx="420" cy="170" r="160" fill="url(#lamp)"/>
    <!-- shelf behind -->
    <g>
      <rect x="300" y="60" width="300" height="6" fill="#3a2a1e"/>
      <g><rect x="310" y="14" width="12" height="46" fill="#2f5d45"/><rect x="324" y="20" width="10" height="40" fill="#3a2f5a"/><rect x="336" y="10" width="14" height="50" fill="#5a3b2a"/><rect x="352" y="22" width="9" height="38" fill="#22345a"/><rect x="380" y="16" width="12" height="44" fill="#1e3f2e"/><rect x="394" y="24" width="10" height="36" fill="#4a3b2a"/><rect x="430" y="12" width="13" height="48" fill="#2f5d45"/><rect x="446" y="20" width="9" height="40" fill="#3a2f5a"/><rect x="500" y="16" width="12" height="44" fill="#22345a"/><rect x="514" y="22" width="10" height="38" fill="#5a3b2a"/><rect x="560" y="14" width="13" height="46" fill="#1e3f2e"/></g>
    </g>
    <!-- desk -->
    <rect x="290" y="236" width="330" height="12" rx="3" fill="#4a3324"/>
    <!-- laptop -->
    <path d="M360,236 L380,140 L540,140 L520,236 Z" fill="#20283f" stroke="#d8d2c7" stroke-opacity="0.4"/>
    <path d="M386,148 L534,148 L518,226 L368,226 Z" fill="#f3f1ec"/>
    <rect x="396" y="158" width="118" height="14" rx="5" fill="#ffffff" stroke="#d8d2c7" transform="skewX(-11) translate(32 0)"/>
    <g transform="skewX(-11) translate(36 0)">
      <rect x="398" y="182" width="16" height="24" rx="2" fill="#2f5d45"/><rect x="420" y="182" width="50" height="4" fill="#5c6460"/><rect x="420" y="190" width="34" height="3" fill="#c9cfe8"/>
      <rect x="398" y="210" width="16" height="12" rx="2" fill="#5a3b2a"/><rect x="420" y="210" width="44" height="4" fill="#5c6460"/>
    </g>
    <path d="M350,236 L540,236 L548,244 L342,244 Z" fill="#2a3150"/>
    <!-- mug -->
    <rect x="560" y="210" width="22" height="26" rx="4" fill="#f3ede1"/><path d="M582,216 C592,216 592,230 582,230" fill="none" stroke="#f3ede1" stroke-width="3"/>
    <g transform="translate(570 170) rotate(12) scale(0.6)" opacity="0.85"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g><g transform="translate(316 120) rotate(-14) scale(0.5)" opacity="0.7"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g>
  </g>
  <text x="36" y="92" font-size="11" font-weight="700" letter-spacing="2.2" fill="#aab3d6">THE PLATFORM</text>
  <text x="34" y="132" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#fff6e6">OpenShelves</text>
  <text x="36" y="164" font-size="13" fill="#c9cfe8">Backend API, web app and</text>
  <text x="36" y="184" font-size="13" fill="#c9cfe8">infrastructure, in one repo.</text>
  <text x="36" y="226" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#ffd59a">Start here →</text>
  <rect x="0.5" y="0.5" width="619" height="299" rx="16" fill="none" stroke="#2a3360"/>
</svg>
