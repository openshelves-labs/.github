      <path d="M210,140 C190,124 166,122 150,132 L150,140 Z" fill="#f3e3bf"/>
      <rect x="80" y="140" width="140" height="6" rx="2" fill="#4a3324"/>
      <circle cx="176" cy="92" r="22" fill="#cfe0ff" fill-opacity="0.18" stroke="#ffd59a" stroke-width="5"/>
      <line x1="192" y1="108" x2="214" y2="130" stroke="#ffd59a" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(110 74) rotate(-16) scale(0.6)" opacity="0.9"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g><g transform="translate(132 46) rotate(12) scale(0.45)" opacity="0.75"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g></g>
    <text x="24" y="204" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#fff6e6">Discover</text>
    <text x="24" y="230" font-size="13" fill="#c9cfe8">Catalog, journals and digital</text>
    <text x="24" y="250" font-size="13" fill="#c9cfe8">resources, in one search.</text>
  </g>
  
