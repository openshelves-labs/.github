<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="280" viewBox="0 0 1260 280" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>What OpenShelves does. Discover: search the catalog, journals and digital resources in one place. Borrow: loans, renewals, holds and fines without the desk. Research: reading lists, history and instant citations. Keep: a calm cataloging workspace for librarians.</title>
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1733"/><stop offset="1" stop-color="#1c2552"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffb37a" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <g id="page">
      <path d="M-9,-12 L7,-12 L9,-10 L9,12 L-9,12 Z" fill="#fff3d6"/>
      <g stroke="#c9a46a" stroke-width="1" opacity="0.6"><line x1="-6" y1="-6" x2="5" y2="-6"/><line x1="-6" y1="-2" x2="5" y2="-2"/><line x1="-6" y1="2" x2="3" y2="2"/></g>
    </g></defs>
  
  <g transform="translate(0 0)">
    <rect x="0.5" y="0.5" width="299" height="279" rx="16" fill="url(#card)" stroke="#2a3360"/>
    <g>
