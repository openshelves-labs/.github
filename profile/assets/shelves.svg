    <g>
      <circle cx="150" cy="100" r="80" fill="url(#lamp)"/>
      <rect x="84" y="56" width="132" height="92" rx="6" fill="#4a3324"/>
      <g fill="#5a3f2c" stroke="#2a1d14" stroke-width="1.5">
