        <line x1="120" y1="110" x2="190" y2="110"/><line x1="120" y1="126" x2="170" y2="126"/>
      </g>
      <g fill="#2f5d45"><circle cx="114" cy="78" r="3"/><circle cx="114" cy="94" r="3"/><circle cx="114" cy="110" r="3"/><circle cx="114" cy="126" r="3"/></g>
      <path d="M190,58 L190,40 L198,46 L206,40 L206,64" fill="#2f5d45"/>
      <g transform="translate(222 70) rotate(14) scale(0.5)" opacity="0.8"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g></g>
