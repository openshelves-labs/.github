      <g transform="translate(181 52) rotate(8)"><rect x="-20" y="-16" width="40" height="28" rx="2" fill="#fffaf0"/><g stroke="#c9a46a" stroke-width="1.5"><line x1="-14" y1="-8" x2="14" y2="-8"/><line x1="-14" y1="-2" x2="10" y2="-2"/><line x1="-14" y1="4" x2="12" y2="4"/></g></g></g>
    <text x="24" y="204" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#fff6e6">Keep</text>
    <text x="24" y="230" font-size="13" fill="#c9cfe8">A calm workspace for</text>
    <text x="24" y="250" font-size="13" fill="#c9cfe8">librarians to catalog.</text>
  </g>
