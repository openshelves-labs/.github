        <rect x="92" y="106" width="54" height="36" rx="3"/><rect x="154" y="106" width="54" height="36" rx="3"/>
      </g>
      <g fill="#fff3d6"><rect x="108" y="78" width="22" height="10" rx="1"/><rect x="170" y="78" width="22" height="10" rx="1"/><rect x="108" y="120" width="22" height="10" rx="1"/><rect x="170" y="120" width="22" height="10" rx="1"/></g>
      <g fill="#ffd59a"><circle cx="119" cy="94" r="2.5"/><circle cx="181" cy="94" r="2.5"/><circle cx="119" cy="136" r="2.5"/><circle cx="181" cy="136" r="2.5"/></g>
