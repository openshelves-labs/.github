<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The demo site, an early sketch: a sketchbook open on a night desk, with pencil drawings of library pages and a pencil beside it.</title>
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1733"/><stop offset="1" stop-color="#1c2552"/></linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd59a" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffb37a" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="pageglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
    <g id="page"><path d="M-9,-12 L7,-12 L9,-10 L9,12 L-9,12 Z" fill="#fff3d6"/><g stroke="#c9a46a" stroke-width="1" opacity="0.6"><line x1="-6" y1="-6" x2="5" y2="-6"/><line x1="-6" y1="-2" x2="5" y2="-2"/><line x1="-6" y1="2" x2="3" y2="2"/></g></g><clipPath id="f"><rect width="620" height="300" rx="16"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="620" height="300" fill="url(#card)"/>
    <circle cx="430" cy="170" r="160" fill="url(#lamp)"/>
    <rect x="290" y="236" width="330" height="12" rx="3" fill="#4a3324"/>
    <!-- sketchbook -->
    <g transform="rotate(-6 450 190)">
      <rect x="330" y="120" width="240" height="116" rx="4" fill="#fffaf0"/>
      <line x1="450" y1="120" x2="450" y2="236" stroke="#d8cdb6" stroke-width="2"/>
      <g fill="none" stroke="#6b6f80" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 3">
        <rect x="346" y="134" width="88" height="14" rx="4"/>
        <rect x="346" y="158" width="18" height="26"/><line x1="372" y1="160" x2="430" y2="160"/><line x1="372" y1="170" x2="414" y2="170"/>
        <rect x="346" y="194" width="18" height="26"/><line x1="372" y1="196" x2="428" y2="196"/><line x1="372" y1="206" x2="410" y2="206"/>
        <path d="M466,140 L556,140 M466,152 L540,152"/><rect x="466" y="166" width="40" height="52" rx="3"/><rect x="514" y="166" width="40" height="52" rx="3"/>
      </g>
    </g>
    <!-- pencil -->
    <g transform="rotate(-28 520 250)"><rect x="470" y="244" width="110" height="10" rx="2" fill="#f2b866"/><polygon points="580,244 596,249 580,254" fill="#f3e3bf"/><polygon points="590,247.5 596,249 590,250.5" fill="#2a2a2a"/><rect x="462" y="244" width="10" height="10" fill="#d0283f"/></g>
    <g transform="translate(560 96) rotate(14) scale(0.55)" opacity="0.8"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g>
  </g>
  <text x="36" y="92" font-size="11" font-weight="700" letter-spacing="2.2" fill="#aab3d6">THE PROTOTYPE</text>
  <text x="34" y="132" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="30" font-weight="600" fill="#fff6e6">Demo Site</text>
  <text x="36" y="164" font-size="13" fill="#c9cfe8">An early sketch on sample data,</text>
  <text x="36" y="184" font-size="13" fill="#c9cfe8">where the experience is headed.</text>
  <text x="36" y="226" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#ffd59a">A glimpse, not the final volume →</text>
  <rect x="0.5" y="0.5" width="619" height="299" rx="16" fill="none" stroke="#2a3360"/>
</svg>
