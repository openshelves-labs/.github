  <rect x="220" y="250" width="820" height="10" rx="3" fill="#4a3324"/>
  <rect x="232" y="260" width="10" height="20" fill="#3a2a1e"/><rect x="1012" y="260" width="10" height="20" fill="#3a2a1e"/>
  <g font-size="13" fill="#c9cfe8" transform="translate(160 0)">
