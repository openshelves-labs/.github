<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="330" viewBox="0 0 1260 330" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The Ledger as a shelf of chapters. Lit: Design (written). Half-lit: Sign-in, Catalog, Web app (being built). Dark: Borrowing, Research tools (planned).</title>
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1733"/><stop offset="1" stop-color="#1c2552"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffb37a" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <g id="page">
      <path d="M-9,-12 L7,-12 L9,-10 L9,12 L-9,12 Z" fill="#fff3d6"/>
      <g stroke="#c9a46a" stroke-width="1" opacity="0.6"><line x1="-6" y1="-6" x2="5" y2="-6"/><line x1="-6" y1="-2" x2="5" y2="-2"/><line x1="-6" y1="2" x2="3" y2="2"/></g>
    </g>
    <linearGradient id="done" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3a6"/><stop offset="1" stop-color="#e9a07a"/></linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c6f0"/><stop offset="1" stop-color="#6d7fbf"/></linearGradient>
    <linearGradient id="planned" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232c55"/><stop offset="1" stop-color="#1a2246"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1259" height="329" rx="16" fill="url(#card)" stroke="#2a3360"/>
  <text x="630" y="52" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#fff6e6">Every great library began as a single shelf.</text>
  
    <g transform="translate(60 0)">
