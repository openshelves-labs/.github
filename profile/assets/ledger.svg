      <rect x="718" y="130" width="100" height="3" fill="#8f98c4" opacity="0.45"/>
      <rect x="718" y="228" width="100" height="3" fill="#8f98c4" opacity="0.45"/>
      <text x="768.0" y="188.0" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#8f98c4">Borrowing</text>
    </g>
    <g transform="translate(60 0)">
      
      <rect x="840" y="98" width="120" height="152" rx="6" fill="url(#planned)" stroke="#d8d2c7" stroke-opacity="0.25"/>
      <rect x="850" y="112" width="100" height="3" fill="#8f98c4" opacity="0.45"/>
      <rect x="850" y="228" width="100" height="3" fill="#8f98c4" opacity="0.45"/>
      <text x="900.0" y="179.0" text-anchor="middle" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="16" font-weight="600" fill="#8f98c4">Research tools</text>
