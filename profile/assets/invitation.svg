<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="300" viewBox="0 0 1260 300" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>An open invitation: the library door left ajar at night, warm light spilling out, pages of light drifting through.</title>
  <defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1733"/><stop offset="1" stop-color="#1c2552"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffb37a" stop-opacity="0.15"/><stop offset="1" stop-color="#ff9f5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <g id="page">
      <path d="M-9,-12 L7,-12 L9,-10 L9,12 L-9,12 Z" fill="#fff3d6"/>
      <g stroke="#c9a46a" stroke-width="1" opacity="0.6"><line x1="-6" y1="-6" x2="5" y2="-6"/><line x1="-6" y1="-2" x2="5" y2="-2"/><line x1="-6" y1="2" x2="3" y2="2"/></g>
    </g>
    <linearGradient id="spill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd59a" stop-opacity="0.45"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#f2b56e"/></linearGradient>
    <clipPath id="f"><rect width="1260" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1260" height="300" fill="url(#card)"/>
    <g fill="#ffffff"><circle cx="420" cy="40" r="1.2" opacity="0.6"/><circle cx="560" cy="70" r="1" opacity="0.5"/><circle cx="1160" cy="50" r="1.2" opacity="0.6"/><circle cx="1050" cy="30" r="1" opacity="0.5"/></g>
    <!-- wall and doorway -->
    <rect x="760" y="40" width="300" height="260" fill="#141b38"/>
    <path d="M820,300 L820,110 A90,90 0 0 1 1000,110 L1000,300 Z" fill="url(#inside)"/>
    <!-- shelves seen through the door -->
    <g opacity="0.55">
      <rect x="840" y="150" width="140" height="5" fill="#a0703f"/><rect x="840" y="210" width="140" height="5" fill="#a0703f"/>
      <g fill="#c98a50"><rect x="846" y="118" width="10" height="32"/><rect x="858" y="124" width="8" height="26"/><rect x="870" y="114" width="12" height="36"/><rect x="900" y="120" width="9" height="30"/><rect x="940" y="116" width="11" height="34"/><rect x="956" y="124" width="8" height="26"/>
      <rect x="848" y="180" width="9" height="30"/><rect x="866" y="176" width="12" height="34"/><rect x="910" y="182" width="10" height="28"/><rect x="930" y="178" width="12" height="32"/><rect x="960" y="184" width="9" height="26"/></g>
    </g>
    <!-- the door, swung open -->
    <path d="M820,300 L820,110 A90,90 0 0 1 866,32 L760,70 L760,300 Z" fill="#3a2a1e"/>
    <path d="M760,300 L760,70 L820,110 L820,300 Z" fill="#4a3324"/>
    <circle cx="772" cy="200" r="4" fill="#ffd59a"/>
    <path d="M820,300 L820,110 A90,90 0 0 1 1000,110 L1000,300" fill="none" stroke="#2a1d14" stroke-width="8"/>
    <!-- light spilling across the ground -->
    <polygon points="820,300 1000,300 640,300 300,300" fill="url(#spill)"/>
    <path d="M300,300 L820,240 L1000,240 L1000,300 Z" fill="url(#spill)" opacity="0.6"/>
    <!-- pages drifting out -->
    <g transform="translate(720 180) rotate(-14) scale(0.8)" opacity="0.9"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g><g transform="translate(660 130) rotate(12) scale(0.65)" opacity="0.85"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g><g transform="translate(600 190) rotate(-20) scale(0.55)" opacity="0.75"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g><g transform="translate(560 110) rotate(8) scale(0.45)" opacity="0.6"><circle r="26" fill="url(#pageglow)"/><use href="#page"/></g>
  </g>
  <text x="48" y="110" font-size="12" font-weight="700" letter-spacing="2.4" fill="#aab3d6">AN OPEN INVITATION</text>
  <text x="44" y="166" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" fill="#fff6e6">The door is open.</text>
  <text x="48" y="204" font-family="Literata, Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#ffd59a">Come in, find a shelf, add a page.</text>
  <rect x="0.5" y="0.5" width="1259" height="299" rx="16" fill="none" stroke="#2a3360"/>
</svg>
